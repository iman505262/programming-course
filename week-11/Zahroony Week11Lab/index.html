<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Interactive Color Page</title>
    <link rel="stylesheet" href="style.css">
    </head>
<body>
    <div class="container">
        <h1>My Interactive Color Page</h1>

        <p>Welcome! Try the different activities below.</p>

        <button id="colorBtn">Change Page Color</button>

        <h2 id="message">Welcome to my page!</h2>

        <p id="hoverText">Move your mouse over this sentence.</p>

        <input id="nameInput" placeholder="Enter your name">

        <p id="output">Your greeting will appear here.</p>

        <p id="keyOutput">Press a key to test the keyboard event.</p>
    </div>

     <script src="script.js"></script>
</body>
</html>
