<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Essentials</title>
    <link rel="=stylesheet" href="style.css">
     <!--<script href="script.js"></script> -->

    <script>
        // Six variables with different data types
        let name = "Iman";
        let age = 34;
        let student = true;
        let favoriteGame = "Resident Evil";
        let score = 95.5;
        let favoriteColor = "Blue";

        // Print each variable to the console
        console.log(name);
        console.log(age);
        console.log(student);
        console.log(favoriteGame);
        console.log(score);
        console.log(favoriteColor);

        // Three math operations
        console.log(10 + 5);
        console.log(20 - 8);
        console.log(6 * 4);

        // String concatenation
        let firstName = "Iman";
        let lastName = "Zahroony";
        console.log(firstName + " " + lastName);
    </script>
</head>

<body>
    <h1>JavaScript Essentials</h1>
    <p>This page is using JavaScript to display information in the console.</p>
</body>
</html>
